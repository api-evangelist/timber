aid: timber
name: Timber
description: >-
  Timber (timber.io) is the developer-tools company, backed by Lux Capital, that
  built Vector — an open-source, high-performance observability data pipeline
  written in Rust. The timber.io domain now redirects to vector.dev, and the
  project is stewarded by Datadog (which acquired Timber in 2021). Vector
  collects, transforms, and routes logs, metrics, and traces from many sources
  through a Vector Remap Language (VRL) transform layer to many sinks, running as
  a single static binary in agent or aggregator roles. Vector is configuration-
  driven (YAML/TOML/JSON) rather than an HTTP SaaS; its programmable surface is a
  local gRPC "Observability API" that lets tooling inspect and interact with a
  running Vector instance (component topology, metrics, health, live event
  tapping). This profile enriches the Timber/Vector lead with the real developer
  surface: the gRPC API, the vector CLI, distribution packages, and project
  security posture.
