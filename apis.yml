apis:
- name: Vector Observability API
  description: >-
    Vector ships with a local gRPC API that lets you interact with a running
    Vector instance — inspect component topology, read internal metrics and
    health, and tap live events flowing through the pipeline. It is disabled by
    default (api.enabled=false) and binds to 127.0.0.1:8686. The API has no
    authentication and is intended for isolated/debugging environments only; it
    must not be exposed to untrusted clients. A GET /health HTTP healthcheck is
    served on the same port for compatibility with existing HTTP probes.
  humanURL: https://vector.dev/docs/reference/api/
  baseURL: https://vector.dev
